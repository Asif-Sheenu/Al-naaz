services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: alnaaz
      POSTGRES_USER: alnaaz_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alnaaz_user -d alnaaz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DEBUG: "False"
      DATABASE_URL: postgres://alnaaz_user:${POSTGRES_PASSWORD}@db:5432/alnaaz
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      REDIS_URL: redis://redis:6379/1
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

volumes:
  postgres_data:
  static_data:
  media_data:
  redis_data: